<app-header></app-header>
<app-nav></app-nav>

<div class="container my-4">
  <div class="card shadow-sm border-0 rounded-3 p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h4 fw-bold mb-1">Listado de Usuarios</h2>
        <span class="badge bg-light text-secondary border">
          Total: {{ usuariosService.usuarios().length }} usuarios registrados
        </span>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col" style="width: 80px;">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Email</th>
          </tr>
        </thead>
        <tbody>
          @for (usuario of usuariosService.usuarios(); track usuario.id) {
            <tr>
              <td class="fw-bold text-primary">#{{ usuario.id }}</td>
              <td>{{ usuario.nombre }}</td>
              <td class="text-muted">{{ usuario.email }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="text-center text-muted py-4">
                No hay usuarios registrados.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-footer></app-footer>
