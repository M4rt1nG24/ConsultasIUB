<div class="layout-container">

    <!-- BARRA LATERAL COMPARTIDA (SHARED SIDEBAR) -->
    <app-sidebar
        [rol]="rolActual()"
        [opciones]="menuDelRol()"
        (cerrarSesion)="cerrarSesion()">
    </app-sidebar>

    <!-- CONTENEDOR PRINCIPAL DERECHO -->
    <div class="main-wrapper">

        <!-- ENCABEZADO INSTITUCIONAL COMPARTIDO -->
        <app-header></app-header>

        <!-- NAVBAR SUPERIOR COMPARTIDA (SHARED NAVBAR CON BUSCADOR Y NOTIFICACIONES) -->
        <app-navbar
            [rol]="rolActual()"
            [nombreUsuario]="nombreUsuario()"
            [busquedaGlobal]="busquedaRapida()"
            (busquedaGlobalChange)="busquedaRapida.set($event)"
            [notificaciones]="notificaciones()"
            [pendientes]="notificacionesPendientes()"
            [mostrarNotificaciones]="mostrarNotificaciones()"
            (toggleNotif)="toggleNotificaciones()"
            (marcarLeidas)="marcarTodasLeidas()">
        </app-navbar>

        <!-- ÁREA DINÁMICA DE VISTAS ENRUTADAS -->
        <main class="page-content">
            <div class="content-card">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </main>

    </div>

    <!-- ==================== CHAT FLOTANTE IA (OLLAMA) ==================== -->
    <button
        type="button"
        class="ia-fab"
        [class.ia-fab-open]="chatAbierto()"
        (click)="toggleChat()"
        aria-label="Asistente IA">
        @if (chatAbierto()) {
            <span class="ia-fab-icon">✕</span>
            <span class="ia-fab-label">Cerrar IA</span>
        } @else {
            <span class="ia-fab-icon">🤖</span>
            <span class="ia-fab-label">Asistente IA</span>
        }
    </button>

    @if (chatAbierto()) {
    <div class="ia-chat-window">
        <div class="ia-chat-header">
            <div class="ia-header-brand">
                <div class="ia-header-avatar">🤖</div>
                <div>
                    <strong>Asistente IA • MiTutoría</strong>
                    <span class="ia-subtitle">● En línea (Ollama Local)</span>
                </div>
            </div>
            <button type="button" class="ia-close-btn" (click)="toggleChat()">✕</button>
        </div>

        <div class="ia-chat-messages">
            @for (msg of mensajesIA(); track $index) {
            <div class="ia-msg" [class.ia-msg-user]="msg.role === 'user'" [class.ia-msg-bot]="msg.role === 'assistant'">
                <div class="ia-msg-bubble">
                    {{ msg.content }}
                </div>
            </div>
            }
            @if (cargandoIA()) {
            <div class="ia-typing">Escribiendo respuesta...</div>
            }
        </div>

        <div class="ia-chat-input">
            <input type="text" name="preguntaIA" [(ngModel)]="preguntaIA" (keyup.enter)="enviarPreguntaIA()"
                placeholder="Pregúntale algo a la IA..." [disabled]="cargandoIA()" />
            <button type="button" (click)="enviarPreguntaIA()" [disabled]="cargandoIA()">
                Enviar
            </button>
        </div>
    </div>
    }

</div>
