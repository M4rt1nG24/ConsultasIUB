services:
  - type: web
    name: consultasiub
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist/Consultas-iub/browser
    # Cabeceras de seguridad HTTP para todo el sitio.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # CSP en modo "Report-Only": solo reporta en la consola del navegador lo que se
      # bloquearía, sin romper nada. Tras verificar que no aparecen avisos, cambiar el
      # nombre a "Content-Security-Policy" para aplicarla.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://code.jquery.com https://cdn.datatables.net 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://cdn.datatables.net; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:11434; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /api-proxy/*
        # Render usa "*" (no ":splat", que es sintaxis de Netlify) para pasar el resto de la ruta.
        destination: https://sistemaconsultas-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
